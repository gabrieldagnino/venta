<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>
    <!-- Vinculamos la hoja de estilos externa -->
    <link rel="stylesheet" href="diseño.css">
</head>
<body>
    <header>
        <h1>Mi Tienda Virtual</h1>
    </header>

    <main class="contenedor">
        <h2>Productos Disponibles</h2>
        <div class="grid-productos">
            <div class="producto">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYGqb6o6qLQMOuIluxUfSSjW9nOdfFI3VC4fgv6PRsPtZGsFqWZWgrP3jZ&s=10LAPTOP" alt="LAPTOP GAMER">
                <h3>Laptop Gamer</h3>
                <p>S/ 3500</p>
                <button onclick="agregarAlCarrito('Laptop Gamer', 3500)">Agregar al Carrito</button>
            </div>
            <div class="producto">
                <img src="https://promart.vteximg.com.br/arquivos/ids/8914144/imageUrl_1.jpg?v=638853067852630000" alt="MOUSE GAMER">
                <h3>Mouse Gamer RGB</h3>
                <p>S/ 120</p>
                <button onclick="agregarAlCarrito('Mouse Gamer RGB', 120)">Agregar al Carrito</button>
            </div>
            <div class="producto">
                <img src="https://media.falabella.com/falabellaPE/136025114_01/w=1500,h=1500,fit=cover" alt="TECLADO MECANICO">
                <h3>Teclado Mecánico</h3>
                <p>S/ 250</p>
                <button onclick="agregarAlCarrito('Teclado Mecánico', 250)">Agregar al Carrito</button>
            </div>
            <div class="producto">
                <img src="https://promart.vteximg.com.br/arquivos/ids/10347041/imageUrl_1.jpg?v=639085466495930000" alt="AUDIFONO INALAMBRICO">
                <h3>Audífonos Inalámbricos</h3>
                <p>S/ 180</p>
                <button onclick="agregarAlCarrito('Audífonos Inalámbricos', 180)">Agregar al Carrito</button>
            </div>
            <div class="producto">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1880cLBwc8kF21ajORX9dI7nklQ93mdsgpb_gMRePZs7p1GgenSo-qWdE&s=10" alt="MONITOR GAMER">
                <h3>Monitor Gamer 144Hz</h3>
                <p>S/ 850</p>
                <button onclick="agregarAlCarrito('Monitor Gamer 144Hz', 850)">Agregar al Carrito</button>
            </div>
            <div class="producto">
                <img src="https://promart.vteximg.com.br/arquivos/ids/5359588-1000-1000/image-43d473025ded48ad9c5ebc9d7fd412e1.jpg?v=637853979995770000" alt="SILLA GAMER">
                <h3>Silla Gamer Ergonómica</h3>
                <p>S/ 600</p>
                <button onclick="agregarAlCarrito('Silla Gamer Ergonómica', 600)">Agregar al Carrito</button>
            </div>
        </div>

        <section class="carrito-seccion">
            <h2>Carrito de Compras</h2>
            <!-- Contenedor donde JS inyectará los items dinámicamente -->
            <div id="lista-carrito"></div>
            <h3 id="total">Total a pagar: S/ 0</h3>
        </section>
    </main>

    <!-- Vinculamos el script de funcionalidad externa -->
    <script src="funcionalidad.js"></script>
</body>
</html>
